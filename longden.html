<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>lồng đèn</title>
  <style>
    :root {
      --accent: #ffb86b;
      --pink: #ff95b7;
      --text: #fff4cf;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at top, #071428 0%, #02040a 60%, #000 100%);
      color: #fff;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 0;
      touch-action: none;
    }

    .ui-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .photo-hint {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(3, 10, 20, 0.55);
      border: 1px solid rgba(255, 215, 150, 0.28);
      color: rgba(255, 245, 223, 0.92);
      font-size: 13.5px;
      font-weight: 500;
      backdrop-filter: blur(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      white-space: nowrap;
    }

    .photo-hint.hide {
      opacity: 0;
      transform: translateX(-50%) translateY(12px);
      pointer-events: none;
    }

    .progress-badge {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 200, 140, 0.3);
      color: #ffe8c8;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      backdrop-filter: blur(6px);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .progress-badge.show {
      opacity: 1;
    }

    .music-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 220, 180, 0.35);
      border-radius: 50%;
      background: rgba(10, 18, 32, 0.55);
      color: #ffd9a8;
      font-size: 20px;
      cursor: pointer;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      transition: transform 0.2s ease, background 0.2s ease;
      z-index: 15;
    }

    .music-btn:hover,
    .music-btn:focus-visible {
      transform: scale(1.08);
      background: rgba(20, 30, 50, 0.7);
      outline: 2px solid rgba(255, 220, 180, 0.5);
      outline-offset: 2px;
    }

    .music-btn.muted {
      opacity: 0.65;
    }

    .photo-popup {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(7px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      pointer-events: none;
    }

    .photo-popup.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .photo-card {
      position: relative;
      width: min(78vw, 440px);
      max-height: 78vh;
      padding: 12px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 221, 163, 0.45);
      box-shadow: 0 0 35px rgba(255, 176, 74, 0.28), 0 25px 70px rgba(0, 0, 0, 0.55);
      transform: scale(0.72) translateY(30px);
      transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .photo-popup.show .photo-card {
      transform: scale(1) translateY(0);
    }

    .photo-card img#memoryPhoto {
      display: block;
      width: 100%;
      max-height: calc(78vh - 24px);
      object-fit: contain;
      border-radius: 16px;
      user-select: none;
      -webkit-user-drag: none;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    /* ===== ĐÁM MÂY (ảnh của bạn) ===== */
    .cloud-overlay {
      position: absolute;
      /* Vị trí góc trên bên trái khung ảnh – bạn có thể chỉnh top/left */
      top: -100px;
      left: -55px;
      width: 240px;          /* chỉnh kích thước mây ở đây */
      z-index: 6;
      opacity: 0;
      transform: scale(0.25) rotate(-18deg) translateY(-20px);
      pointer-events: none;
      transition: none;
    }

    .cloud-overlay.show {
      opacity: 1;
      transform: scale(1) rotate(-6deg) translateY(0);
      transition:
        opacity 0.55s ease,
        transform 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .cloud-overlay img.cloud-img {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.35));
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Chữ đè lên mây – chỉnh font-size, màu, vị trí cho khớp ảnh mây của bạn */
    .cloud-text {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      text-align: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-weight: 700;
      font-size: 13px;           /* chỉnh cỡ chữ */
      line-height: 1.25;
      color: #5c2e1a;           /* màu chữ ví dụ */
      text-shadow:
        0 1px 0 rgba(255, 255, 255, 0.75),
        0 0 6px rgba(255, 255, 255, 0.4);
      pointer-events: none;
      white-space: pre-line;    /* cho phép xuống dòng nếu cần */
    }

    .photo-close {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: #fff7e7;
      color: #6b3d17;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.35);
      pointer-events: auto;
      z-index: 10;
    }

    .photo-close:hover {
      transform: scale(1.08);
    }

    .heartvip-stem {
      position: fixed;
      left: 50%;
      top: calc(50% + 34px);
      z-index: 7;
      width: 4px;
      height: 110px;
      border-radius: 999px;
      background: linear-gradient(to bottom, rgba(255, 207, 225, 0.95), rgba(156, 81, 109, 0.9));
      box-shadow: 0 0 18px rgba(255, 142, 184, 0.7);
      opacity: 0;
      visibility: hidden;
      transform: translateX(-50%) scaleY(0);
      transform-origin: top center;
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0.8s;
      pointer-events: none;
    }

    .heartvip-stem::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -10px;
      width: 18px;
      height: 18px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(255, 234, 244, 0.95);
      box-shadow: 0 0 16px rgba(255, 146, 176, 0.8);
    }

    .heartvip-stem.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) scaleY(1);
    }

    .heartvip-trigger {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 8;
      width: 82px;
      height: 82px;
      border: 1px solid rgba(255, 224, 235, 0.85);
      border-radius: 50%;
      color: #fff7fb;
      background: radial-gradient(circle at 35% 30%, #ffb6cf, #e84f83 68%, #a91f58);
      box-shadow: 0 0 24px rgba(255, 104, 157, 0.9), 0 0 70px rgba(255, 104, 157, 0.42);
      font-size: 42px;
      line-height: 1;
      font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.2);
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0.8s;
      animation: heartvip-pulse 1.5s ease-in-out infinite;
    }

    .heartvip-trigger.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .heartvip-hint {
      position: fixed;
      left: 50%;
      top: calc(50% + 88px);
      z-index: 9;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(29, 8, 18, 0.5);
      border: 1px solid rgba(255, 210, 228, 0.55);
      color: #fff4fb;
      font: 600 15px/1.3 "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 10px rgba(255, 109, 168, 0.65);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.6s ease, visibility 0.6s ease, transform 0.6s ease;
    }

    .heartvip-trigger.show + .heartvip-hint {
      opacity: 1;
      visibility: visible;
    }

    .heartvip-trigger::before {
      content: "";
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      border: 1px solid rgba(255, 210, 228, 0.7);
      opacity: 0;
      animation: heartvip-ring 2.4s ease-out infinite;
    }

    .heartvip-trigger:hover,
    .heartvip-trigger:focus-visible {
      transform: translate(-50%, -50%) scale(1.12);
      outline: 2px solid rgba(255, 238, 246, 0.9);
      outline-offset: 4px;
    }

    @keyframes heartvip-pulse {
      50% {
        box-shadow: 0 0 34px rgba(255, 104, 157, 1), 0 0 86px rgba(255, 104, 157, 0.52);
      }
    }

    @keyframes heartvip-ring {
      0%   { opacity: 0.85; transform: scale(0.82); }
      70%  { opacity: 0; transform: scale(1.4); }
      100% { opacity: 0; transform: scale(1.5); }
    }

    /* ===== CHỮ BÊN TRONG VÒNG TRÁI TIM TRẮNG ===== */
    .heart-message {
      position: fixed;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%) scale(0.85);
      z-index: 6;
      max-width: min(78vw, 340px);
      padding: 0 16px;
      text-align: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-weight: 600;
      font-size: clamp(15px, 4.2vw, 19px);
      line-height: 1.45;
      color: #fff8f0;
      text-shadow:
        0 0 12px rgba(255, 200, 220, 0.9),
        0 0 28px rgba(255, 140, 180, 0.55),
        0 2px 6px rgba(0, 0, 0, 0.45);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0.7s;
    }

    .heart-message.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    /* ===== LỜI TỎ TÌNH CUỐI ===== */
    .confess-overlay {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 32px;
      background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.35) 55%, transparent 100%);
      opacity: 0;
      visibility: hidden;
      transform: translateY(24px);
      transition: opacity 0.55s ease, transform 0.55s ease, visibility 0.55s;
      pointer-events: none;
    }

    .confess-overlay.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }

    .confess-text {
      margin: 0 0 18px;
      max-width: 340px;
      text-align: center;
      font-size: clamp(16px, 4.5vw, 20px);
      font-weight: 600;
      line-height: 1.4;
      color: #fff4e8;
      text-shadow: 0 2px 12px rgba(255, 120, 160, 0.55);
    }

    .confess-btns {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .confess-btn {
      min-width: 120px;
      padding: 12px 22px;
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .confess-btn:active {
      transform: scale(0.96);
    }

    .confess-btn.yes {
      background: linear-gradient(135deg, #ff8fb8, #e84f83);
      color: #fff;
      box-shadow: 0 6px 22px rgba(232, 79, 131, 0.45);
    }

    .confess-btn.no {
      background: rgba(255, 255, 255, 0.12);
      color: #ffe8d6;
      border: 1px solid rgba(255, 220, 180, 0.35);
    }

    .confess-btn.yes:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 28px rgba(232, 79, 131, 0.6);
    }

    .confess-btn.no:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Bảng mật mã */
    .pass-panel {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s;
      pointer-events: none;
    }

    .pass-panel.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .pass-card {
      width: min(88vw, 280px);
      padding: 18px 14px 14px;
      border-radius: 20px;
      background: rgba(18, 12, 22, 0.94);
      border: 1px solid rgba(255, 180, 200, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
      transform: scale(0.88);
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .pass-panel.show .pass-card {
      transform: scale(1);
    }

    .pass-title {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 600;
      color: #ffe8f0;
    }

    .pass-display {
      margin: 0 0 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 180, 200, 0.35);
      font-size: 26px;
      letter-spacing: 0.4em;
      color: #fff;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pass-error {
      margin: 0 0 8px;
      font-size: 13px;
      color: #ff8a9a;
      min-height: 16px;
      opacity: 0;
      transition: opacity 0.25s;
    }

    .pass-error.show {
      opacity: 1;
    }

    .pass-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .pass-key {
      height: 44px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .pass-key:active {
      transform: scale(0.94);
      background: rgba(255, 160, 190, 0.35);
    }

    .pass-key.action {
      font-size: 13px;
      background: rgba(255, 120, 160, 0.22);
    }

    .pass-key.ok {
      background: linear-gradient(135deg, #ff8fb8, #e84f83);
      color: #fff;
    }

    /* Thông báo cảm ơn – hiện ngắn rồi biến mất */
    .thanks-msg {
      position: fixed;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%) scale(0.85);
      z-index: 35;
      padding: 18px 26px;
      border-radius: 18px;
      background: rgba(20, 10, 18, 0.88);
      border: 1px solid rgba(255, 180, 200, 0.45);
      box-shadow: 0 0 40px rgba(255, 120, 160, 0.35);
      color: #fff4f8;
      font-size: clamp(17px, 4.8vw, 22px);
      font-weight: 700;
      text-align: center;
      text-shadow: 0 0 16px rgba(255, 140, 180, 0.6);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0.4s;
      pointer-events: none;
    }

    .thanks-msg.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    .credit {
      position: fixed;
      right: 12px;
      bottom: 10px;
      color: #9fb6c9;
      font-size: 11px;
      opacity: 0.55;
      z-index: 5;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <audio id="bgMusic" loop preload="auto">
    <source src="./nhac/nhactrungthu.mp3" type="audio/mpeg">
  </audio>

  <canvas id="c"></canvas>

  <div class="ui-layer">
    <div class="progress-badge" id="progressBadge">Đã mở 0/9</div>
    <div class="photo-hint" id="photoHint">Nhấn vào các lồng đèn để mở bất ngờ</div>
  </div>

  <button class="music-btn" id="musicBtn" type="button" aria-label="Bật/tắt nhạc" title="Bật/tắt nhạc">♪</button>

  <div class="photo-popup" id="photoPopup" aria-hidden="true" role="dialog">
    <div class="photo-card">
      <button class="photo-close" id="photoClose" aria-label="Đóng">×</button>
      <img id="memoryPhoto" src="" alt="Kỷ niệm" />

      <!-- Đám mây của bạn + chữ ví dụ -->
      <div class="cloud-overlay" id="cloudOverlay">
        <img class="cloud-img" src="./anh/cloud.png" alt="Mây" />
        <div class="cloud-text">Anh hạnh phúc vì được gặp em trong cuộc đời này<br>💗</div>
      </div>
    </div>
  </div>

  <!-- Chữ hiện trong vòng trái tim trắng -->
  <div class="heart-message" id="heartMessage">
    mong em cũng thích sự có mặt của anh như vậy
  </div>

  <div class="heartvip-stem" id="heartVipStem" aria-hidden="true"></div>
  <button class="heartvip-trigger" id="heartVipTrigger" type="button" aria-label="Mở trái tim yêu thương">❤</button>
  <div class="heartvip-hint" aria-live="polite">Bấm vào trái tim nhé 💗</div>

  <!-- Lời tỏ tình cuối -->
  <div class="confess-overlay" id="confessOverlay">
    <p class="confess-text">Đồng ý làm người yêu anh nha 💗</p>
    <div class="confess-btns">
      <button class="confess-btn yes" id="btnYes" type="button">Đồng ý</button>
      <button class="confess-btn no" id="btnNo" type="button">Không đồng ý</button>
    </div>
  </div>

  <!-- Bảng nhập mật mã + bàn phím số -->
  <div class="pass-panel" id="passPanel">
    <div class="pass-card">
      <p class="pass-title">Nhập mật mã 4 số nha 🔐</p>
      <div class="pass-display" id="passDisplay">••••</div>
      <p class="pass-error" id="passError">Sai rồi, thử lại nha</p>
      <div class="pass-keypad" id="passKeypad">
        <button type="button" class="pass-key" data-key="1">1</button>
        <button type="button" class="pass-key" data-key="2">2</button>
        <button type="button" class="pass-key" data-key="3">3</button>
        <button type="button" class="pass-key" data-key="4">4</button>
        <button type="button" class="pass-key" data-key="5">5</button>
        <button type="button" class="pass-key" data-key="6">6</button>
        <button type="button" class="pass-key" data-key="7">7</button>
        <button type="button" class="pass-key" data-key="8">8</button>
        <button type="button" class="pass-key" data-key="9">9</button>
        <button type="button" class="pass-key action" data-key="clear">Xóa</button>
        <button type="button" class="pass-key" data-key="0">0</button>
        <button type="button" class="pass-key ok" data-key="ok">OK</button>
      </div>
    </div>
  </div>

  <!-- Thông báo cảm ơn -->
  <div class="thanks-msg" id="thanksMsg"></div>

  <div class="credit">Cơn Mưa Hoa Đăng</div>

  <script>
    // ===================== CONFIG =====================
    const CONFIG = {
      FOCAL: 1000,
      Z_MIN: 0.1,
      Z_MAX: 2.0,
      NEEDED_CLICKS: 9,
      FORMATION_DURATION: 4800,
      /* Thời gian hiện chữ trong vòng trái tim (đủ đọc) */
      MESSAGE_DURATION: 2800,
      HEART_PARTICLES: window.matchMedia('(max-width: 768px)').matches ? 14 : 22,
      LANTERN_COUNT: window.matchMedia('(max-width: 768px)').matches ? 70 : 105,
      GIRL_NAME: 'Em'
    };

    // ===================== CANVAS SETUP =====================
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d', { alpha: false });
    let W = canvas.width = innerWidth;
    let H = canvas.height = innerHeight;

    // ===================== STATE =====================
    let skyPhase = 'rain';
    let motionScale = 1;
    let formationStartedAt = 0;
    let formationTargets = [];
    const openedLanterns = new Set();
    let currentPhotoIndex = 0;
    let musicPlayed = false;
    let isMuted = false;

    // ===================== DOM =====================
    const photoPopup    = document.getElementById('photoPopup');
    const memoryPhoto   = document.getElementById('memoryPhoto');
    const photoClose    = document.getElementById('photoClose');
    const photoHint     = document.getElementById('photoHint');
    const progressBadge = document.getElementById('progressBadge');
    const heartVipTrigger = document.getElementById('heartVipTrigger');
    const heartVipStem  = document.getElementById('heartVipStem');
    const heartMessage  = document.getElementById('heartMessage');

    // ===================== UTILS =====================
    function rand(a, b) { return a + Math.random() * (b - a); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    function hexToRgba(hex, alpha) {
      const h = hex.replace('#', '');
      const n = parseInt(h, 16);
      return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
    }

    function seededRandom(seed) {
      let s = seed;
      return function () {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    // ===================== HEART PARTICLES =====================
    const heartParticles = [];

    function spawnHeartParticles() {
      const cx = W * 0.5;
      const cy = H * 0.46;
      heartParticles.length = 0;
      for (let i = 0; i < CONFIG.HEART_PARTICLES; i++) {
        heartParticles.push({
          x: cx + (Math.random() - 0.5) * 200,
          y: cy + (Math.random() - 0.5) * 200,
          r: rand(2, 6.5),
          vx: (Math.random() - 0.5) * 1.2,
          vy: -Math.random() * 1.5 - 0.4,
          life: 1,
          color: i % 2 === 0 ? '#ffd6e7' : '#ff95b7'
        });
      }
    }

    function drawHeartAura() {
      const cx = W * 0.5;
      const cy = H * 0.46;
      const radius = Math.min(W, H) * 0.22;
      const t = performance.now() * 0.0014;

      const glow = ctx.createRadialGradient(cx, cy, radius * 0.1, cx, cy, radius * 1.55);
      glow.addColorStop(0, 'rgba(255, 182, 193, 0.32)');
      glow.addColorStop(0.45, 'rgba(255, 153, 189, 0.14)');
      glow.addColorStop(1, 'rgba(255, 153, 189, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(cx - radius * 1.7, cy - radius * 1.7, radius * 3.4, radius * 3.4);

      ctx.beginPath();
      ctx.moveTo(cx, cy + radius * 0.55);
      for (let a = 0; a <= Math.PI * 2 + 0.1; a += 0.09) {
        const x = 16 * Math.pow(Math.sin(a), 3);
        const y = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a));
        ctx.lineTo(cx + x * radius * 0.055, cy + y * radius * 0.055 + 22 + Math.sin(t + a * 2.5) * 6);
      }
      ctx.closePath();
      ctx.strokeStyle = 'rgba(255, 228, 238, 0.88)';
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(255, 120, 170, 0.7)';
      ctx.shadowBlur = 18;
      ctx.stroke();
      ctx.shadowBlur = 0;

      for (const p of heartParticles) {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.014;
        p.vy += 0.007;
        if (p.life <= 0) {
          p.x = cx + (Math.random() - 0.5) * 180;
          p.y = cy + (Math.random() - 0.5) * 180;
          p.life = 1;
          p.vx = (Math.random() - 0.5) * 1.3;
          p.vy = -Math.random() * 1.6 - 0.4;
        }
        const hex = p.color.slice(1);
        const r = parseInt(hex.slice(0, 2), 16);
        const g = parseInt(hex.slice(2, 4), 16);
        const b = parseInt(hex.slice(4, 6), 16);
        ctx.beginPath();
        ctx.fillStyle = `rgba(${r},${g},${b},${Math.max(0.18, p.life)})`;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ===================== HEART FORMATION =====================
    function heartCurveX(t) { return 16 * Math.pow(Math.sin(t), 3); }
    function heartCurveY(t) { return -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)); }

    function buildHeartTargets() {
      const targets = [];
      const scale = Math.min(W, H) * 0.0185;
      const cx = W * 0.5;
      const cy = H * 0.46;
      const total = lanterns.length;

      const outlineCount = Math.ceil(total * 0.68);
      for (let i = 0; i < outlineCount; i++) {
        const t = (i / outlineCount) * Math.PI * 2;
        targets.push({
          x: cx + heartCurveX(t) * scale,
          y: cy + heartCurveY(t) * scale
        });
      }

      const rng = seededRandom(777);
      while (targets.length < total) {
        const t = rng() * Math.PI * 2;
        const shrink = 0.22 + rng() * 0.52;
        targets.push({
          x: cx + heartCurveX(t) * scale * shrink,
          y: cy + heartCurveY(t) * scale * shrink
        });
      }
      return targets;
    }

    function beginHeartFormation() {

    // ===================== LANTERN CLASS =====================
    class Lantern {
      constructor() {
        this.reset(true);
      }

      reset(fromTop = false) {
        this.size = rand(36, 45);
        this.x = rand(-0.08 * W, 1.08 * W);
        this.y = fromTop ? rand(-H * 0.45, -8) : rand(-H * 0.18, -8);
        this.z = rand(CONFIG.Z_MIN, CONFIG.Z_MAX);
        this.vx = rand(-0.2, 0.2);
        this.vy = rand(0.17, 0.25);
        this.vz = rand(-0.008, 0.008);
        this.phase = rand(0, Math.PI * 2);
        this.sway = rand(11, 30);
        this.rotation = rand(-0.07, 0.07);
        this.color = this.pickColor();
        this.glow = rand(0.55, 1.15);
        this.alpha = rand(0.72, 0.94);
        this.age = 0;
        this.twinkle = Math.random();
        this.depth = rand(0.65, 1.35);
        this.screenX = 0;
        this.screenY = 0;
        this.screenSize = 0;
      }

      pickColor() {
        const palettes = [
          ['#ffd59e', '#ffb86b', '#ff7a45'],
          ['#fff3b0', '#ffd166', '#ffb4a2'],
          ['#ffe7f1', '#ffb6c1', '#ff7b9c']
        ];
        const p = palettes[(Math.random() * 3) | 0];
        return p[(Math.random() * p.length) | 0];
      }

      update(dt) {
        if (skyPhase === 'pause' || skyPhase === 'message') return;

        if (skyPhase === 'forming' || skyPhase === 'heart') {
          const target = formationTargets[this.formationIndex];
          if (target) {
            const scale = CONFIG.FOCAL / (CONFIG.FOCAL + this.z);
            const targetX = (target.x - W / 2 * (1 - scale)) / scale;
            const targetY = (target.y - H / 2 * (1 - scale)) / scale;
            const progress = Math.min(1, (performance.now() - formationStartedAt) / CONFIG.FORMATION_DURATION);
            const eased = easeOutCubic(progress);
            this.x = lerp(this.formationStartX ?? this.x, targetX, eased);
            this.y = lerp(this.formationStartY ?? this.y, targetY, eased);
            this.rotation = lerp(this.formationStartRotation ?? this.rotation, 0, eased);
          }
          return;
        }

        this.age += dt;
        this.vy += 0.00016 * (this.size / 24);
        this.x += (this.vx + Math.sin(this.age * 0.017 + this.phase) * (this.sway * this.depth * 0.002)) * motionScale;
        this.y += this.vy * (1.04 + this.depth * 0.11) * motionScale;
        this.z += this.vz;

        if (this.z < CONFIG.Z_MIN) this.z = CONFIG.Z_MIN;
        if (this.z > CONFIG.Z_MAX) this.z = CONFIG.Z_MAX;

        this.rotation += Math.sin(this.age * 0.0048 + this.phase) * 0.0004;
        this.alpha = 0.74 + 0.2 * Math.sin(this.age * 0.019 + this.phase * 2.8) * this.twinkle;

        const scale = CONFIG.FOCAL / (CONFIG.FOCAL + this.z);
        if (this.y - this.size * scale > H + 70) {
          this.reset(false);
          this.x = rand(-0.08 * W, 1.08 * W);
          this.y = -rand(8, 160);
        }
      }

      draw(glowFactor) {
        const scale = CONFIG.FOCAL / (CONFIG.FOCAL + this.z);
        const px = this.x * scale + W / 2 * (1 - scale);
        const py = this.y * scale + H / 2 * (1 - scale);
        const s = this.size * scale;

        this.screenX = px;
        this.screenY = py;
        this.screenSize = s;

        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(this.rotation);

        const gR = s * (2.3 + glowFactor * this.glow);
        const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, gR);
        grd.addColorStop(0, hexToRgba(this.color, 0.22 * this.alpha));
        grd.addColorStop(0.4, hexToRgba(this.color, 0.07 * this.alpha));
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(0, 0, gR, 0, Math.PI * 2);
        ctx.fill();

        const w = s * 0.78;
        const h = s * 1.02;
        const bodyAlpha = Math.max(0.56, this.alpha * (1 - (this.z - CONFIG.Z_MIN) / (CONFIG.Z_MAX - CONFIG.Z_MIN)));
        ctx.beginPath();
        roundRectPath(ctx, -w / 2, -h / 2, w, h, w * 0.42);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = bodyAlpha;
        ctx.fill();
        ctx.lineWidth = Math.max(1.4, s * 0.05);
        ctx.strokeStyle = 'rgba(55, 24, 15, 0.7)';
        ctx.stroke();

        ctx.globalAlpha = 0.16 * this.alpha;
        for (let i = -2; i <= 2; i++) {
          const ix = (i / 3) * w * 0.68;
          ctx.beginPath();
          ctx.moveTo(ix, -h / 2);
          ctx.quadraticCurveTo(ix * 1.35, 0, ix, h / 2);
          ctx.lineWidth = Math.max(1, s * 0.04);
          ctx.strokeStyle = '#000';
          ctx.stroke();
        }

        ctx.globalAlpha = 1;
        const flameY = h * 0.11;
        const flameH = s * 0.26;
        const flameW = s * 0.11;
        const fGrd = ctx.createRadialGradient(0, flameY, 0, 0, flameY, flameH);
        fGrd.addColorStop(0, '#fff9c8');
        fGrd.addColorStop(0.45, '#ffd36a');
        fGrd.addColorStop(1, 'rgba(255, 90, 40, 0)');
        ctx.fillStyle = fGrd;
        ctx.beginPath();
        ctx.ellipse(0, flameY, flameW, flameH, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // ===================== MOON =====================
    let moonCraterData = null;
    let moonMariaData = null;
    let lastMoonRadius = -1;

    function generateMoonFeatures(R) {
      const rng = seededRandom(42);
      const craters = [];
      for (let i = 0; i < 16; i++) {
        const r = R * (0.03 + rng() * 0.13);
        const angle = rng() * Math.PI * 2;
        const dist = rng() * (R - r * 1.05);
        const ox = Math.cos(angle) * dist;
        const oy = Math.sin(angle) * dist;
        if (Math.hypot(ox, oy) + r < R) {
          craters.push({
            ox, oy,
            w: r * (0.85 + rng() * 0.28),
            h: r * (0.65 + rng() * 0.32),
            rot: rng() * Math.PI,
            alpha: 0.08 + rng() * 0.2,
            rimAlpha: 0.04 + rng() * 0.07
          });
        }
      }
      const maria = [
        { ox: -0.2, oy: -0.15, rx: 0.27, ry: 0.21 },
        { ox: 0.15, oy: 0.1, rx: 0.21, ry: 0.17 },
        { ox: -0.05, oy: 0.24, rx: 0.17, ry: 0.13 },
        { ox: 0.24, oy: -0.19, rx: 0.14, ry: 0.11 },
        { ox: -0.28, oy: 0.05, rx: 0.11, ry: 0.16 }
      ].map(m => ({
        ox: m.ox * R, oy: m.oy * R,
        rx: m.rx * R, ry: m.ry * R,
        alpha: 0.055 + rng() * 0.055
      }));
      return { craters, maria };
    }

    function drawMoon() {
      const moonX = W * 0.8;
      const moonY = H * 0.15;
      const baseR = Math.min(W, H) * 0.095;
      const scale = CONFIG.FOCAL / (CONFIG.FOCAL + CONFIG.Z_MAX);
      const R = baseR * scale;

      if (Math.abs(R - lastMoonRadius) > 0.6) {
        const f = generateMoonFeatures(R);
        moonCraterData = f.craters;
        moonMariaData = f.maria;
        lastMoonRadius = R;
      }

      const breathe = 1 + 0.055 * Math.sin(performance.now() * 0.00075);
      ctx.save();

      const haze = R * 4.6 * breathe;
      const hazeG = ctx.createRadialGradient(moonX, moonY, R * 0.25, moonX, moonY, haze);
      hazeG.addColorStop(0, 'rgba(255,252,230,0.09)');
      hazeG.addColorStop(0.35, 'rgba(255,248,220,0.035)');
      hazeG.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = hazeG;
      ctx.beginPath();
      ctx.arc(moonX, moonY, haze, 0, Math.PI * 2);
      ctx.fill();

      const glowR = R * 2.8 * breathe;
      const glowG = ctx.createRadialGradient(moonX, moonY, R * 0.45, moonX, moonY, glowR);
      glowG.addColorStop(0, 'rgba(255,250,235,0.42)');
      glowG.addColorStop(0.3, 'rgba(255,245,215,0.16)');
      glowG.addColorStop(0.6, 'rgba(255,240,200,0.06)');
      glowG.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glowG;
      ctx.beginPath();
      ctx.arc(moonX, moonY, glowR, 0, Math.PI * 2);
      ctx.fill();

      const coronaR = R * 1.5 * breathe;
      const coronaG = ctx.createRadialGradient(moonX, moonY, R * 0.75, moonX, moonY, coronaR);
      coronaG.addColorStop(0, 'rgba(255,253,240,0.5)');
      coronaG.addColorStop(0.55, 'rgba(255,248,220,0.12)');
      coronaG.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = coronaG;
      ctx.beginPath();
      ctx.arc(moonX, moonY, coronaR, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.beginPath();
      ctx.arc(moonX, moonY, R, 0, Math.PI * 2);
      ctx.clip();

      const bodyG = ctx.createRadialGradient(moonX - R * 0.22, moonY - R * 0.22, R * 0.08, moonX, moonY, R);
      bodyG.addColorStop(0, '#fffef5');
      bodyG.addColorStop(0.4, '#f5f0d8');
      bodyG.addColorStop(0.78, '#e8e0c0');
      bodyG.addColorStop(1, '#d8cfb0');
      ctx.fillStyle = bodyG;
      ctx.fillRect(moonX - R, moonY - R, R * 2, R * 2);

      const warmG = ctx.createRadialGradient(moonX + R * 0.28, moonY + R * 0.28, 0, moonX, moonY, R);
      warmG.addColorStop(0, 'rgba(255,220,160,0.13)');
      warmG.addColorStop(1, 'rgba(180,170,140,0.08)');
      ctx.fillStyle = warmG;
      ctx.fillRect(moonX - R, moonY - R, R * 2, R * 2);

      if (moonMariaData) {
        for (const m of moonMariaData) {
          ctx.globalAlpha = m.alpha;
          const mG = ctx.createRadialGradient(moonX + m.ox, moonY + m.oy, 0, moonX + m.ox, moonY + m.oy, Math.max(m.rx, m.ry));
          mG.addColorStop(0, 'rgba(140,135,115,0.65)');
          mG.addColorStop(0.6, 'rgba(160,155,135,0.28)');
          mG.addColorStop(1, 'rgba(180,175,155,0)');
          ctx.fillStyle = mG;
          ctx.beginPath();
          ctx.ellipse(moonX + m.ox, moonY + m.oy, m.rx, m.ry, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      if (moonCraterData) {
        for (const c of moonCraterData) {
          const cx = moonX + c.ox;
          const cy = moonY + c.oy;
          ctx.globalAlpha = c.alpha;
          const cG = ctx.createRadialGradient(cx - c.w * 0.12, cy - c.h * 0.12, 0, cx, cy, Math.max(c.w, c.h));
          cG.addColorStop(0, 'rgba(170,165,145,0.85)');
          cG.addColorStop(0.5, 'rgba(190,185,165,0.45)');
          cG.addColorStop(1, 'rgba(210,205,185,0)');
          ctx.fillStyle = cG;
          ctx.beginPath();
          ctx.ellipse(cx, cy, c.w, c.h, c.rot, 0, Math.PI * 2);
          ctx.fill();

          ctx.globalAlpha = c.rimAlpha;
          ctx.strokeStyle = 'rgba(255,252,240,0.35)';
          ctx.lineWidth = Math.max(0.5, c.w * 0.07);
          ctx.beginPath();
          ctx.ellipse(cx, cy, c.w * 1.02, c.h * 1.02, c.rot, Math.PI * 0.75, Math.PI * 1.75);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }

      const termG = ctx.createLinearGradient(moonX - R, moonY, moonX + R, moonY);
      termG.addColorStop(0, 'rgba(0,0,0,0)');
      termG.addColorStop(0.72, 'rgba(0,0,0,0)');
      termG.addColorStop(1, 'rgba(0,0,20,0.16)');
      ctx.fillStyle = termG;
      ctx.fillRect(moonX - R, moonY - R, R * 2, R * 2);

      const edgeG = ctx.createRadialGradient(moonX - R * 0.12, moonY - R * 0.12, R * 0.38, moonX, moonY, R);
      edgeG.addColorStop(0, 'rgba(0,0,0,0)');
      edgeG.addColorStop(0.86, 'rgba(0,0,0,0)');
      edgeG.addColorStop(1, 'rgba(0,0,20,0.13)');
      ctx.fillStyle = edgeG;
      ctx.fillRect(moonX - R, moonY - R, R * 2, R * 2);

      ctx.restore();

      ctx.globalAlpha = 0.32;
      const specG = ctx.createRadialGradient(moonX - R * 0.28, moonY - R * 0.28, 0, moonX - R * 0.28, moonY - R * 0.22, R * 0.55);
      specG.addColorStop(0, 'rgba(255,255,255,0.55)');
      specG.addColorStop(0.5, 'rgba(255,255,255,0.08)');
      specG.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = specG;
      ctx.beginPath();
      ctx.arc(moonX, moonY, R, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.restore();
    }

    // ===================== LANTERNS =====================
    let lanterns = [];
    let LAST = performance.now();
    let glowFactor = 0.58;

    function spawn(n) {
      lanterns = [];
      for (let i = 0; i < n; i++) {
        const L = new Lantern();
        L.formationIndex = i;
        lanterns.push(L);
      }
    }
    spawn(CONFIG.LANTERN_COUNT);

    // ===================== MAIN LOOP =====================
    function update() {
      const now = performance.now();
      const dt = Math.min((now - LAST) * 0.06, 2.5);
      LAST = now;

      ctx.fillStyle = '#02040a';
      ctx.fillRect(0, 0, W, H);

      drawMoon();

      if (skyPhase === 'rain' || skyPhase === 'slowing') {
        lanterns.sort((a, b) => a.z - b.z);
      }

      for (const L of lanterns) L.update(dt);
      for (const L of lanterns) L.draw(glowFactor);

      /* Vòng trái tim trắng hiện từ lúc có message → forming → heart */
      if (skyPhase === 'message' || skyPhase === 'forming' || skyPhase === 'heart') {
        drawHeartAura();
      }

      requestAnimationFrame(update);
    }
    requestAnimationFrame(update);

    // ===================== PHOTO (đã sửa flash trên mobile) =====================
    memoryPhoto.onload = () => {
      memoryPhoto.style.opacity = '1';
    };

    memoryPhoto.onerror = () => {
      console.warn('Không load được ảnh:', memoryPhoto.src);
    };

    function openNextPhoto() {
      if (!memoryImages.length) return;

      // Ẩn mây trước khi đổi ảnh
      cloudOverlay.classList.remove('show');

      // Ẩn ảnh trước khi đổi src
      memoryPhoto.style.opacity = '0';

      const isFirstPhoto = (currentPhotoIndex === 0);

      // Đợi transition rồi mới gán src mới
      setTimeout(() => {
        memoryPhoto.src = memoryImages[currentPhotoIndex];
        currentPhotoIndex = (currentPhotoIndex + 1) % memoryImages.length;

        // Chỉ hiện mây khi mở anh1.jpg
        if (isFirstPhoto) {
          // Đợi popup + ảnh hiện xong rồi mới bung mây (bất ngờ)
          setTimeout(() => {
            cloudOverlay.classList.add('show');
          }, 380);
        }
      }, 40);

      photoPopup.classList.add('show');
      photoPopup.setAttribute('aria-hidden', 'false');
    }

    function closePhoto() {
      photoPopup.classList.remove('show');
      photoPopup.setAttribute('aria-hidden', 'true');
      cloudOverlay.classList.remove('show');
      setTimeout(() => {
        memoryPhoto.style.opacity = '0';
      }, 300);
    }

    photoClose.addEventListener('click', e => {
      e.stopPropagation();
      closePhoto();
    });
    photoPopup.addEventListener('click', e => {
      if (e.target === photoPopup) closePhoto();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closePhoto();
    });

    // ===================== INTERACTION =====================
    function handlePointer(clientX, clientY) {
      if (skyPhase !== 'rain') return;

      let hit = null;
      let best = Infinity;
      for (const L of lanterns) {
        if (L.screenX == null) continue;
        const d = Math.hypot(clientX - L.screenX, clientY - L.screenY);
        const radius = Math.max(22, L.screenSize * 0.78);
        if (d <= radius && d < best) {
          hit = L;
          best = d;
        }
      }

      if (hit && !openedLanterns.has(hit)) {
        openedLanterns.add(hit);
        openNextPhoto();

        const count = openedLanterns.size;
        progressBadge.textContent = `Đã mở ${count}/${CONFIG.NEEDED_CLICKS}`;
        progressBadge.classList.add('show');

        if (count === 1) {
          photoHint.textContent = `Còn ${CONFIG.NEEDED_CLICKS - 1} lồng đèn nữa…`;
        } else if (count < CONFIG.NEEDED_CLICKS) {
          photoHint.textContent = `Còn ${CONFIG.NEEDED_CLICKS - count} lồng đèn nữa ✨`;
        }

        if (count >= CONFIG.NEEDED_CLICKS) {
          beginHeartFormation();
        }
      }

      if (!musicPlayed && audio) {
        audio.play().then(() => {
          musicPlayed = true;
          musicBtn.textContent = '♪';
        }).catch(() => {});
      }
    }

    canvas.addEventListener('click', e => handlePointer(e.clientX, e.clientY));
    canvas.addEventListener('touchend', e => {
      if (e.changedTouches.length) {
        const t = e.changedTouches[0];
        handlePointer(t.clientX, t.clientY);
      }
    }, { passive: true });

    heartVipTrigger.addEventListener('click', () => {
      window.location.href = 'heartvip/index.html';
    });

    // ===== TỎ TÌNH + MẬT MÃ (bàn phím số) =====
    btnYes.addEventListener('click', () => {
      confessOverlay.classList.remove('show');
      passValue = '';
      updatePassDisplay();
      passError.classList.remove('show');
      passPanel.classList.add('show');
    });

    btnNo.addEventListener('click', () => {
      showThanks('Cảm ơn');
    });

    function checkPassword() {
      if (passValue === SECRET_CODE) {
        showThanks('Cảm ơn em 💗');
      } else {
        passError.classList.add('show');
        passValue = '';
        updatePassDisplay();
      }
    }

    passKeypad.addEventListener('click', e => {
      const btn = e.target.closest('.pass-key');
      if (!btn) return;
      const key = btn.dataset.key;
      passError.classList.remove('show');

      if (key === 'clear') {
        passValue = '';
        updatePassDisplay();
        return;
      }
      if (key === 'ok') {
        checkPassword();
        return;
      }
      if (passValue.length < 4) {
        passValue += key;
        updatePassDisplay();
        // Đủ 4 số thì tự kiểm tra
        if (passValue.length === 4) {
          setTimeout(checkPassword, 180);
        }
      }
    });

    musicBtn.addEventListener('click', () => {
      if (!audio) return;
      if (!musicPlayed) {
        audio.play().then(() => {
          musicPlayed = true;
          isMuted = false;
          musicBtn.textContent = '♪';
          musicBtn.classList.remove('muted');
        }).catch(() => {});
        return;
      }
      isMuted = !isMuted;
      audio.muted = isMuted;
      musicBtn.textContent = isMuted ? '🔇' : '♪';
      musicBtn.classList.toggle('muted', isMuted);
    });

    // ===================== RESIZE =====================
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        W = canvas.width = innerWidth;
        H = canvas.height = innerHeight;
        if (skyPhase === 'heart' || skyPhase === 'forming') {
          formationTargets = buildHeartTargets();
        }
      }, 120);
    });

  </script>
</body>
</html>
